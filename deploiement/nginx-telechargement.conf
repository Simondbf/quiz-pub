# Configuration nginx du site de téléchargement, installée par deploiement/nginx.sh.
# Ne pas modifier le fichier copié dans /etc/nginx : modifier celui-ci,
# puis relancer le script.

# HTTP : tout part vers HTTPS. Le renvoi est dans « location / » pour que
# certbot puisse encore répondre à Let's Encrypt lors des renouvellements.
server {
    listen 80;
    server_name telechargement.soleiljaune.be;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name telechargement.soleiljaune.be;

    ssl_certificate /etc/letsencrypt/live/telechargement.soleiljaune.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telechargement.soleiljaune.be/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fichiers enregistrés sans tampon ni coupure.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
