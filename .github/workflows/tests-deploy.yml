name: Tests CI — Quiz Pub et YT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-pub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer FFmpeg, Python et yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3 curl
          sudo curl -fsSL -o /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          sudo chmod 755 /usr/local/bin/yt-dlp
          yt-dlp --version
      - run: npm ci
      - run: npm test
      - name: Vérifier la configuration Docker et les scripts
        run: |
          docker compose config --quiet
          bash -n deploiement/*.sh

